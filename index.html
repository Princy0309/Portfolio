<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princy Mishra | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation bar -->
    <header class="navbar-container">
        <div class="nav-brand">
            <a href="#home">Princy Mishra</a>
        </div>
        <nav class="nav-links">
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero-sec">
        <div class="hero-content-wrapper">
            <div class="hero-text">
                <span class="hero-greet">Hi, I am</span>
                <h1 class="hero-name">Princy Mishra</h1>
                <h2 class="hero-about">
                    I am a <span class="typewriter-txt">Developer</span>
                </h2>
                <p class="hero-description">
                    Engineering student building a strong foundation in frontend web development, exploring Python backend systems, and practicing DSA with C++.
                </p>
            </div>
            <div class="hero-image-container">
                <div class="hero-img-box">
                    <img src="myImg.jpg" alt="Princy Mishra" class="hero-img">
                </div>
            </div>
        </div>

        <!-- Skills Section Target -->
        <div id="skills" class="about-card">
            <h3 class="card-title">SKILLS</h3>
            <div class="skills-chips">
                <span class="chip">C++/DSA</span>
                <span class="chip">JavaScript</span>
                <span class="chip">React.js</span>
                <span class="chip">HTML5 & CSS3</span>
                <span class="chip">PostgreSQL</span>
            </div>
        </div>
    </section>
</body>
</html>
